<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout.html}">
<head>
    <title>EventHub - Events</title>
    <!-- <script src="content-script.js"></script> -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" />
    <style>
        .events-filter-container {
            margin: 1rem;
            border-radius: 10px;
        }
        .search-bar {
            display: flex;
        }
        #search {
            width: 100%;
            display: inline-block;
        }
        #search-button {
            margin-left: -1rem;
        }
        #filter-button {
            margin-left: -0.1rem;
        }
        .filters-container {
            margin-top: 1rem;
            padding: 1rem 1.5rem;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            background-color: #f8f9fa;
        }
        .filters-container label {
            font-weight: 500;
            margin-bottom: 0.25rem;
            display: block;
        }
        .filters-container input[type="text"] {
            width: 100%;
            padding: 0.45rem 0.75rem;
            margin-bottom: 1rem;
        }
        .filter-tags-container,
        .filter-keywords-container {
            margin-bottom: 1rem;
        }
        .filter-tags-container label,
        .filter-keywords-container label {
            margin-bottom: 0.25rem;
        }
        .filter-tags-item,
        .filter-keywords-item {
            display: inline-flex;
            align-items: center;
            margin-left: 1rem;
            margin-right: 1rem;
            margin-bottom: 0.5rem;
        }
        .filter-tags-item input[type="checkbox"],
        .filter-keywords-item input[type="checkbox"] {
            margin-right: 0.5rem;
        }

        .events-display-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: flex-start;
        }
        .event-item {
            flex-direction: column;
            width: 30rem;
            border: 0.2rem solid white;
            margin: 1rem;
            padding: 1rem;
        }
        .event-item img {
            /*  change img size later  */
        }
        .event-details {
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem
        }
        .event-meta {
            display: flex;
            justify-content: space-between;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }
        .close {
            color: #aaaaaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }

        .event-banner {
            width: 100%;
            height: clamp(160px, 22vw, 280px);
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }

        /* image gallery style */
        .modal-content .gallery { margin-top: 1rem; }

        .gallery h4 { margin: 0 0 .5rem; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .gallery-item {
            position: relative;
        }

        .delete-btn {
            position: absolute; top: 6px; right: 6px;
            width: 28px; height: 28px; border: none; border-radius: 50%;
            background: #e53935; color: #fff; font-size: 18px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 4px rgba(0,0,0,.2); cursor: pointer; opacity: .95;
        }

        .delete-btn:hover { transform: scale(1.06); opacity: 1; }

        .delete-btn:focus { outline: 2px solid #fff; outline-offset: 2px; }


        @media (max-width: 900px) {
        .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 560px) {
        .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="events-filter-container">
            <form action="/events" method="GET">
                <div class="search-bar">
                    <label for="search"></label>
                    <input type="text" id="search" name="search" placeholder="Search..."/>
                    <button id="search-button" type="submit">Search</button>
                    <button id="filter-button" type="button" data-bs-toggle="collapse" data-bs-target="#filters-container-collapsible" aria-expanded="false" aria-controls="filters-container-collapsible">
                        Filters
                    </button>
                </div>
                <div class="filters-container collapse" id="filters-container-collapsible">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="Melbourne..."/>
                    <label for="category">Category</label>
                    <input type="text" id="category" name="category" placeholder="Coding..."/>
                    <div class="filter-tags-container">
                        <label>Tags:</label>
                        <div class="filter-tags-item" th:each="tag: ${tags}">
                            <label th:if="${#strings.length(tag) > 2}">
                                <input type="checkbox" name="tags" value="${tag}" />
                                <span th:text="${#strings.capitalize(tag)}"></span>
                            </label>
                        </div>
                    </div>
                    <div class="filter-keywords-container">
                        <label>Keywords:</label>
                        <div class="filter-keywords-item" th:each="keyword : ${keywords}">
                            <label th:if="${#strings.length(keyword) > 2}">
                                <input type="checkbox" name="keywords" value="${keyword}" />
                                <span th:text="${#strings.capitalize(keyword)}"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="events-display-container">
            <div class="event-item" th:each="event : ${events}">
                <!-- !!! TODO: prepends to welcome folder, change as necessary -->
                <img class="event-banner"
                    th:src="@{/images/welcome/{f}(f=${event.images[0]})}"
                    th:alt="${event.images[0]}" />
                <div class="event-details">
                    <h2 th:text="${event.getTitle()}">Event Title</h2>
                    <p th:text="${event.getDescription()}">Event Description</p>
                    <div class="event-meta">
                        <span th:text="${#temporals.format(event.getDate(), 'dd/MM/yyyy')}">Event Start Time</span>
                        <span th:text="${event.getLocation()}">Event Location</span>
                    </div>
                </div>
                <!-- Modal which will pop up when user clicks "View details", listing all the important aspects of the event  -->
                <button th:attr="onclick=|showModal('infoModal' + ${event.id}, ${event.id})|" class="btn btn-secondary">View Details</button>
                    <div th:attr="id=${'infoModal' + event.id}" class="modal">
                        <div class="modal-content">

                        <section class="page-split">
                            <div id="left">
                                <h3>Event Details</h3>
                                <p><strong>ID:</strong> <span th:text="${event.getId()}"></span></p>
                                <p><strong>Name:</strong> <span th:text="${event.getTitle()}"></span></p>
                                <p><strong>Description:</strong> <span th:text="${event.getDescription()}"></span></p>
                                <p><strong>Date:</strong> <span th:text="${#temporals.format(event.getDate(), 'dd/MM/yyyy')}"></span></p>
                                <p><strong>Ticket Price: $</strong><span th:text="${event.getTicketPrice()}"></span></p>
                                <a th:href="@{/checkout(id=${event.id}, title=${event.title})}" class="btn btn-primary">Buy Ticket</a>
                                <button th:attr="onclick=|hideModal('infoModal' + ${event.getId()})|" class="btn btn-secondary">Close</button>
                                <!-- Delete event button which only shows if user is a club organiser and also is the owner of the event -->
                                <div class="delete-btn-wrapper" style="display: none;">
                                    <button class="btn btn-danger" th:onclick="|deleteEvent(${event.id}, this)|">Delete Event</button>
                                </div>
                            </div>
                            <div id="right">
                                    <p><strong>Location:</strong> <span th:text="${event.getLocation()}"></span></p>
                                <iframe
                                    id="LocationEmbedd"
                                    width="400"
                                    height="250"
                                    loading="lazy"
                                    th:src="@{${'https://www.google.com/maps?q=' + event.getLocation() + '&output=embed'}}">
                                </iframe>
                            </div>
                        </section>
                        <hr class="divider"/>

                        <!-- add image gallery to event details -->
                        <!-- !!!! TODO: show add and delete buttons only to organiser/admin  -->
                         <section class="gallery">
                            <div style="display:flex;align-items:center;justify-content:space-between;">
                                <h4>Gallery</h4>
                                <button type="button" class="btn btn-sm btn-primary"
                                        onclick="addImage(this)">+ Add image</button>
                            </div>

                            <div class="gallery-grid" th:attr="data-event-id=${event.id}">
                                <div class="gallery-item" th:each="img : ${event.images}">
                                <button type="button" class="delete-btn"
                                        onclick="deleteImage(this)">X</button>

                                <!-- !!! TODO: prepends to welcome folder, change as necessary -->
                                <img th:src="@{'/images/welcome/' + ${img}}"
                                    alt="Event photo" loading="lazy">
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </div>

                <!-- document.getElementById(modalId).style.display = 'block';
                fetch('/events/modal?eventid=' + eventId); -->

    <div layout:fragment="scripts">
        <script th:inline="javascript">
            function showModal(modalId, eventId) {
                const modal = document.getElementById(modalId);
                modal.style.display = 'block';

                fetch(`/events/modal/${eventId}`)
                    .then(res => res.json())
                    .then(data => {
                        const deleteWrapper = modal.querySelector('.delete-btn-wrapper');
                            deleteWrapper.style.display = data.isOwner ? 'inline-block' : 'none';
                    })
                    .catch(err => console.error(err));
            }
            function hideModal(modalId) {
                document.getElementById(modalId).style.display = 'none';
            }

            // close modal when you click off it
            document.addEventListener('click', (e) => {
                const overlay = e.target.closest('.modal');
                if (overlay && e.target === overlay) {
                hideModal(overlay.id);
                }
            });

            // find eventId and index from the clicked tile
            function getTileContext(btnEl) {
                const tile = btnEl.closest('.gallery-item');
                const grid = tile?.parentElement;
                const eventId = grid?.dataset.eventId;
                const index = tile ? Array.from(grid.children).indexOf(tile) : -1;
                return { tile, grid, eventId, index };
            }

            // DELETE the specific image tile
            function deleteImage(btnEl) {
                const { tile, grid, eventId, index } = getTileContext(btnEl);
                if (!grid || !eventId || index < 0) return alert('Could not locate image tile.');

                fetch(`/events/${eventId}/images/${index}`, { method: 'DELETE' })
                .then(r => r.ok ? (tile.remove()) : r.text().then(t => Promise.reject(t || 'Delete failed')))
                .catch(msg => alert(msg));
            }

            // POST a placeholder image "temp.png"
            function addImage(btnEl) {
                const modal = btnEl.closest('.modal-content');
                const grid = modal?.querySelector('.gallery-grid');
                const eventId = grid?.dataset.eventId;
                if (!grid || !eventId) return alert('Could not find gallery.');

                fetch(`/events/${eventId}/images`, { method: 'POST' })
                .then(r => {
                    if (!r.ok) return r.text().then(t => Promise.reject(t || 'Add failed'));
                    const tile = document.createElement('div');
                    tile.className = 'gallery-item';
                    tile.innerHTML = `
                    <button type="button" class="delete-btn" onclick="deleteImage(this)">×</button>
                    <img src="/images/welcome/temp.png" alt="Event photo" loading="lazy">
                    `;
                    grid.appendChild(tile);
                })
                .catch(msg => alert(msg));
            }

            // DELETE selected event from database
            function deleteEvent(eventId, btnEl) {
                if (!confirm("Are you sure you want to delete this event?")) {
                    return;
                }

                fetch(`/events/${eventId}`, { method: 'DELETE' })
                    .then(r => {
                        if (r.ok) {
                            // close modal & refresh page
                            btnEl.closest(".modal").style.display = "none";
                            location.reload();
                        } else {
                            // if event didn't delete
                            return r.text().then(msg => {
                                throw new Error(msg || "Failed to delete event.");
                            });
                        }
                    })
                    .catch(err => alert(err.message));
            }

        </script>
    </div>
</body>

</html>
