<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout.html}">
<head>
    <title>Welcome to EventHub</title>
    <!-- <script src="content-script.js"></script> -->
    <style>
        .event-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2em;
            justify-content: flex-start;
        }
        .event-item {
            flex-direction: column;
            width: 30em;
            border: 0.2em solid white;
            margin: 1em;
            padding: 1em;
        }
        .event-item img {
            /*  change img size later  */
        }
        .event-details {
            padding: 0.5em;
            display: flex;
            flex-direction: column;
            gap: 0.25em
        }
        .event-meta {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <h1>Events</h1>
        <div>
            <form action="/events" method="GET">
                <label for="search">Search:</label>
                <input type="text" id="search" name="search" placeholder="Search..."/>
                <div class="filters-container">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="Location..."/>
                    <label for="category">Category</label>
                    <input type="text" id="category" name="category" placeholder="Category..."/>
                    <div class="filter-tags">
                        <label>
                            <input type="checkbox" name="tags" value="education" /> Education
                        </label>
                        <label>
                            <input type="checkbox" name="tags" value="beginner" /> Beginner
                        </label>
                        <label>
                            <input type="checkbox" name="tags" value="competition" /> Competition
                        </label>
                        <label>
                            <input type="checkbox" name="tags" value="teamwork" /> Teamwork
                        </label>
                    </div>
                    <div class="filter-keywords">
                        <label>
                            <input type="checkbox" name="keywords" value="java" /> Java
                        </label>
                        <label>
                            <input type="checkbox" name="keywords" value="workshop" /> Workshop
                        </label>
                        <label>
                            <input type="checkbox" name="keywords" value="coding" /> Coding
                        </label>
                        <label>
                            <input type="checkbox" name="keywords" value="challenge" /> Challenge
                        </label>
                    </div>
                    <div>
                        <button type="submit">Search</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="event-container">
            <div class="event-item" th:each="event : ${events}">
                <h2 th:text="${event.getImages()[0]}">Event Image</h2>
                <div class="event-details">
                    <h2 th:text="${event.getTitle()}">Event Title</h2>
                    <p th:text="${event.getDescription()}">Event Description</p>
                    <div class="event-meta">
                        <span th:text="${#temporals.format(event.getDate(), 'dd/MM/yyyy')}">Event Start Time</span>
                        <span th:text="${event.getLocation()}">Event Location</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
