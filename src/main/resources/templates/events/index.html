<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout.html}">
<head>
    <title>Welcome to EventHub</title>
    <!-- <script src="content-script.js"></script> -->
    <style>
        .event-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2em;
            justify-content: flex-start;
        }
        .event-item {
            flex-direction: column;
            width: 30em;
            border: 0.2em solid white;
            margin: 1em;
            padding: 1em;
        }
        .event-item img {
            /*  change img size later  */
        }
        .event-details {
            padding: 0.5em;
            display: flex;
            flex-direction: column;
            gap: 0.25em
        }
        .event-meta {
            display: flex;
            justify-content: space-between;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto; 
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }

        .close {
            color: #aaaaaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <h1>Events</h1>
        <div>
            <form action="/events" method="GET">
                <label for="search">Search:</label>
                <input type="text" id="search" name="search" placeholder="Search..."/>
                <div class="filters-container">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="Location..."/>
                    <label for="category">Category</label>
                    <input type="text" id="category" name="category" placeholder="Category..."/>
                    <div class="filter-tags-container">
                        <label>Tags</label>
                        <div class="filter-tags-item" th:each="tag: ${tags}">
                           <label>
                               <input type="checkbox" name="tags" value="${tag}" th:text="${tag.substring(0, 1).toUpperCase() + tag.substring(1)}" />
                           </label>
                        </div>
                    </div>
                    <div class="filter-keywords-container">
                        <label>Keywords</label>
                        <div class="filter-keywords-item" th:each="keyword : ${keywords}">
                            <label>
                                <input type="checkbox" name="keywords" value="${keyword}" th:text="${keyword.substring(0, 1).toUpperCase() + keyword.substring(1)}" />
                            </label>
                        </div>
                    </div>
                    <div>
                        <button type="submit">Search</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="event-container">
            <div class="event-item" th:each="event : ${events}">
                <h2 th:text="${event.getImages()[0]}">Event Image</h2>
                <div class="event-details">
                    <h2 th:text="${event.getTitle()}">Event Title</h2>
                    <p th:text="${event.getDescription()}">Event Description</p>
                    <div class="event-meta">
                        <span th:text="${#temporals.format(event.getDate(), 'dd/MM/yyyy')}">Event Start Time</span>
                        <span th:text="${event.getLocation()}">Event Location</span>
                    </div>
                </div>
                <button th:attr="onclick=|showModal('infoModal' + ${event.id})|">View Details</button>
                    <div th:each="event : ${events}" th:attr="id=${'infoModal' + event.id}" class="modal">
                    <div class="modal-content">
                        <h3>Event</h3>
                        <p><strong>ID:</strong> <span th:text="${event.getId()}"></span></p>
                        <p><strong>Name:</strong> <span th:text="${event.getTitle()}"></span></p>
                        <p><strong>Description:</strong> <span th:text="${event.getDescription()}"></span></p>
                        <p><strong>Date:</strong> <span th:text="${#temporals.format(event.getDate(), 'dd/MM/yyyy')}"></span></p>
                        <p><strong>Location:</strong> <span th:text="${event.getLocation()}"></span></p>
                        <button th:attr="onclick=|hideModal('infoModal' + ${event.getId()})|">Close</button>
                    </div>
                </div>
            </div>
        </div>

        

    </div>
    
    <div layout:fragment="scripts">
        <script>
            function showModal(modalId) {
                document.getElementById(modalId).style.display = 'block';
            }

            function hideModal(modalId) {
                document.getElementById(modalId).style.display = 'none';
            }
        </script>
    </div>
</body>

</html>
