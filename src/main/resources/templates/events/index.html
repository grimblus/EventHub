<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout.html}">
<head>
    <title>EventHub - Events</title>
    <!-- <script src="content-script.js"></script> -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" />
    <style>
        .events-filter-container {
            margin: 1rem;
            border-radius: 10px;
        }
        .search-bar {
            display: flex;
        }
        #search {
            width: 100%;
            display: inline-block;
        }
        #search-button {
            margin-left: -1rem;
        }
        #filter-button {
            margin-left: -0.1rem;
        }
        .filters-container {
            margin-top: 1rem;
            padding: 1rem 1.5rem;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            background-color: #f8f9fa;
        }
        .filters-container label {
            font-weight: 500;
            margin-bottom: 0.25rem;
            display: block;
        }
        .filters-container input[type="text"] {
            width: 100%;
            padding: 0.45rem 0.75rem;
            margin-bottom: 1rem;
        }
        .filter-tags-container,
        .filter-keywords-container {
            margin-bottom: 1rem;
        }
        .filter-tags-container label,
        .filter-keywords-container label {
            margin-bottom: 0.25rem;
        }
        .filter-tags-item,
        .filter-keywords-item {
            display: inline-flex;
            align-items: center;
            margin-left: 1rem;
            margin-right: 1rem;
            margin-bottom: 0.5rem;
        }
        .filter-tags-item input[type="checkbox"],
        .filter-keywords-item input[type="checkbox"] {
            margin-right: 0.5rem;
        }

        .events-display-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: flex-start;
        }
        .event-item {
            flex-direction: column;
            width: 30rem;
            border: 0.2rem solid white;
            margin: 1rem;
            padding: 1rem;
        }
        .event-item img {
            /*  change img size later  */
        }
        .event-details {
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem
        }
        .event-meta {
            display: flex;
            justify-content: space-between;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto; 
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }

        .close {
            color: #aaaaaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }

        /* image gallery style */
        .modal-content .gallery { margin-top: 1rem; }
        .gallery h4 { margin: 0 0 .5rem; }

        .gallery-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        }

        .gallery-item img {
        width: 100%;
        height: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 8px;
        display: block;
        }

        @media (max-width: 900px) {
        .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 560px) {
        .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="events-filter-container">
            <form action="/events" method="GET">
                <div class="search-bar">
                    <label for="search"></label>
                    <input type="text" id="search" name="search" placeholder="Search..."/>
                    <button id="search-button" type="submit">Search</button>
                    <button id="filter-button" type="button" data-bs-toggle="collapse" data-bs-target="#filters-container-collapsible" aria-expanded="false" aria-controls="filters-container-collapsible">
                        Filters
                    </button>
                </div>
                <div class="filters-container collapse" id="filters-container-collapsible">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location" placeholder="Melbourne..."/>
                    <label for="category">Category</label>
                    <input type="text" id="category" name="category" placeholder="Coding..."/>
                    <div class="filter-tags-container">
                        <label>Tags:</label>
                        <div class="filter-tags-item" th:each="tag: ${tags}">
                           <label>
                               <input type="checkbox" name="tags" value="${tag}" th:text="${tag.substring(0, 1).toUpperCase() + tag.substring(1)}" />
                           </label>
                        </div>
                    </div>
                    <div class="filter-keywords-container">
                        <label>Keywords:</label>
                        <div class="filter-keywords-item" th:each="keyword : ${keywords}">
                            <label>
                                <input type="checkbox" name="keywords" value="${keyword}" th:text="${keyword.substring(0, 1).toUpperCase() + keyword.substring(1)}" />
                            </label>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="events-display-container">
            <div class="event-item" th:each="event : ${events}">
                <img th:src="${event.getImages()[0]}" th:alt="${event.getImages()[0]}" />
                <div class="event-details">
                    <h2 th:text="${event.getTitle()}">Event Title</h2>
                    <p th:text="${event.getDescription()}">Event Description</p>
                    <div class="event-meta">
                        <span th:text="${#temporals.format(event.getDate(), 'dd/MM/yyyy')}">Event Start Time</span>
                        <span th:text="${event.getLocation()}">Event Location</span>
                    </div>
                </div>
                <button th:attr="onclick=|showModal('infoModal' + ${event.id})|">View Details</button>
                    <div th:each="event : ${events}" th:attr="id=${'infoModal' + event.id}" class="modal">
                    <div class="modal-content">
                                    
                        <section class="page-split">
                            <div id="left">
                                <h3>Event Details</h3>
                                <p><strong>ID:</strong> <span th:text="${event.getId()}"></span></p>
                                <p><strong>Name:</strong> <span th:text="${event.getTitle()}"></span></p>
                                <p><strong>Description:</strong> <span th:text="${event.getDescription()}"></span></p>
                                <p><strong>Date:</strong> <span th:text="${#temporals.format(event.getDate(), 'dd/MM/yyyy')}"></span></p>
                                <p><strong>Ticket Price: $</strong><span th:text="${event.getTicketPrice()}"></span></p>
                                <a th:href="@{/checkout(id=${event.id}, title=${event.title})}" class="btn btn-primary">Buy Ticket</a>
                                <button th:attr="onclick=|hideModal('infoModal' + ${event.getId()})|" class="btn btn-secondary">Close</button>
                            </div>
                            <div id="right">
                                    <p><strong>Location:</strong> <span th:text="${event.getLocation()}"></span></p>
                                <iframe
                                    id="LocationEmbedd"
                                    width="400"
                                    height="250"
                                    loading="lazy"
                                    th:src="@{${'https://www.google.com/maps?q=' + event.getLocation() + '&output=embed'}}">
                                </iframe>
                            </div>
                        </section>
                        <hr class="divider"/>
                        
                        <!-- add image gallery to event details -->
                        <section class="gallery">
                        <h3>Event Gallery</he>
                        <div class="gallery-grid">
                            <div th:each="i : ${#numbers.sequence(1,9)}" class="gallery-item">
                                <img th:src="@{/images/welcome/img1.jpg}" alt="Event photo" loading="lazy">
                            </div>
                        </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div layout:fragment="scripts">
        <script>
            function showModal(modalId) {
                document.getElementById(modalId).style.display = 'block';
            }
            function hideModal(modalId) {
                document.getElementById(modalId).style.display = 'none';
            }
        </script>
    </div>
</body>

</html>
