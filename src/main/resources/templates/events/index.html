<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout.html}">
<head>
    <title>Welcome to EventHub</title>
    <!-- <script src="content-script.js"></script> -->
    <style>
        .event-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2em;
            justify-content: flex-start;
        }
        .event-item {
            flex-direction: column;
            width: 30em;
            border: 0.2em solid white;
            margin: 1em;
            padding: 1em;
        }
        .event-item img {
            /*  change img size later  */
        }
        .event-details {
            padding: 0.5em;
            display: flex;
            flex-direction: column;
            gap: 0.25em
        }
        .event-meta {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <h1>Events</h1>
        <div>
            <form>
                <label for="search">Search:</label>
                <input type="text" id="search" name="search" value="event name or event organiser"/>
                <label for="tags1">Some tag 1</label>
                <input type="checkbox" id="tags1" name="tags1" value="tags1"/>
                <label for="tags2">Some tag 2</label>
                <input type="checkbox" id="tags2" name="tags2" value="tags2"/>
                <label for="tags3">Some tag 3</label>
                <input type="checkbox" id="tags3" name="tags3" value="tags3"/>
            </form>
        </div>
        <div class="event-container">
            <div class="event-item" th:each="event : ${events}">
                <h2 th:text="${'Some Image (Change to img tag later)'}">Event Image</h2>
                <div class="event-details">
                    <h2 th:text="${event.getTitle()}">Event Title</h2>
                    <p th:text="${event.getDescription()}">Event Description</p>
                    <div class="event-meta">
                        <span th:text="${#temporals.format(event.getDate(), 'dd/MM/yyyy')}">Event Start Time</span>
                        <span th:text="${event.getLocation()}">Event Location</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
