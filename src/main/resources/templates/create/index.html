<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout.html}">

<head>
    <title>Event Hub - Create</title>
    <!-- <script src="content-script.js"></script> -->
    <style>
        .form-block {
            display: flex;
            width: 100%;
            padding: 1.5rem;
            align-content: center;
            justify-content: center;
        }

        .form-elements {
            display: flex;
            flex-direction: column;
            align-content: flex-start;
            align-items: flex-start;
            background: #aaaaaa;
            padding: 1rem;
            border-radius: 8px;
            width: 42.5rem;
        }

        .form-elements label {
            display: block;
            font-weight: bold;
            margin: 0 0 0.5rem 0;
        }

        .form-elements input,
        .form-elements textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 0.6rem;
            margin-bottom: 1.2rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .form-elements textarea {
            resize: vertical; /* user can resize vertically */
            min-height: 80px;
        }

        .form-elements button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            background: #4a90e2;
            color: white;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-block">
            <form action="/create" method="POST">
                <div class="form-elements">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" placeholder="Event Title" />

                    <label for="description">Description:</label>
                    <textarea id="description" name="description" placeholder="Event Description"></textarea>

                    <label for="date">Date:</label>
                    <input type="datetime-local" id="date" name="date" placeholder="Event Date" />

                    <label for="location">Location:</label>
                    <input type="text" id="location" name="location" placeholder="Location" />

                    <label for="ticketPrice">Ticket Price:</label>
                    <input type="text" id="ticketPrice" name="ticketPrice" placeholder="Ticket Price" />

                    <label for="category">Category:</label>
                    <input type="text" id="category" name="category" placeholder="Category" />

                    <label for="tags">Tags:</label>
                    <input type="text" id="tags" name="tags" placeholder="Tags" />

                    <button type="button">
                        Submit
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
