<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
  <head>
    <meta charset="utf-8" />
    <title>Layout page</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="page-container">
      <!-- navbar -->
      <nav>
        <div>
          <a th:href="@{/}">Home</a>
          <a href="/events">Events</a>
          <a th:if="${isOrganiser}" th:href="@{/create}">Create</a>
          <a th:if="${isOrganiser}" th:href="@{/dashboard}"
            >Creator Dashboard</a
          >
          <a th:if="${loggedIn}" href="/account">Account</a>
          <a
            th:if="${loggedIn && user.permissionLevel.name() == 'ADMIN'}"
            href="/admin"
            >Admin</a
          >
        </div>
        <div th:if="${loggedIn}">
          <a th:href="@{/logout}">Sign Out</a>
        </div>
        <div th:if="${!loggedIn}">
          <a href="/login">Log In</a>
          <a href="/signUp">Sign Up</a>
        </div>
      </nav>

      <!-- child page content -->
      <div layout:fragment="content">
        <p>Page content goes here</p>
      </div>
    </div>

    <!-- footer -->
    <footer>
      <p>&copy; 2025 EventHub. All rights reserved.</p>
    </footer>

    <!--  Bootstrap  -->
    <script
      th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"
    ></script>

    <div layout:fragment="scripts"></div>
  </body>
</html>
