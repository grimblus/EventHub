<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout.html}"
>
  <head>
    <title>myEvents</title>
    <style>
      .events-filter-container {
        margin: 1rem;
        border-radius: 10px;
      }

      .events-display-container {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        justify-content: flex-start;
      }
      .event-list {
        flex-direction: column;
        width: 30rem;
        border: 0.2rem solid white;
        margin: 1rem;
        padding: 1rem;
      }

      .event-meta {
        display: flex;
        justify-content: space-between;
      }
      .event-details {
        padding: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        border: 2px solid #111111;
      }
      .modal {
        display: none;
        position: fixed;
        z-index: 9999;
        padding-top: 100px;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.4);
      }

      .modal-content {
        background-color: #fefefe;
        margin: auto;
        padding: 20px;
        border: 1px solid #888;
        width: 80%;
      }
      .close {
        color: #aaaaaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
      }

      .close:hover,
      .close:focus {
        color: #000;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
    <!-- <script src="content-script.js"></script> -->
  </head>

  <body>
    <div layout:fragment="content">
      <h2>Your saved events</h2>
      <p class="vertical-group" th:if="${savedEvents.size() == 0}">
        You have not saved any events.
      </p>

      <div class="events-display-container">
        <div class="event-list" th:each="event : ${savedEvents}">
          <div class="event-details">
            <h2 th:text="${event.getTitle()}">Event Title</h2>
            <p th:text="${event.getDescription()}">Event Description</p>
            <div class="event-meta">
              <span
                th:text="${#temporals.format(event.getDate(), 'dd/MM/yyyy')}"
                >Event Start Time</span
              >
              <span th:text="${event.getLocation()}">Event Location</span>
            </div>
            <div class="event-meta">
              <span th:text="${'Category: ' + event.getCategory()}"
                >Event Category</span
              >
              <span
                th:text="${'Tags: ' + #strings.listJoin(event.getTags(), ' • ')}"
                >Event Tags</span
              >
            </div>
            <button
              th:attr="onclick=|showModal('infoModal' + ${event.id}, ${event.id})|"
              class="btn btn-primary"
            >
              View Details
            </button>
          </div>

          <div th:attr="id=${'infoModal' + event.id}" class="modal">
            <div class="modal-content">
              <section class="page-split">
                <div id="left">
                  <h3>Event Details</h3>
                  <p>
                    <strong>ID:</strong>
                    <span th:text="${event.getId()}"></span>
                  </p>
                  <p>
                    <strong>Name:</strong>
                    <span th:text="${event.getTitle()}"></span>
                  </p>
                  <p>
                    <strong>Description:</strong>
                    <span th:text="${event.getDescription()}"></span>
                  </p>
                  <p>
                    <strong>Date:</strong>
                    <span
                      th:text="${#temporals.format(event.getDate(), 'dd/MM/yyyy')}"
                    ></span>
                  </p>
                  <p>
                    <strong>Ticket Price: $</strong
                    ><span th:text="${event.getTicketPrice()}"></span>
                  </p>
                  <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
                    <!-- <a th:href="@{/events/{id}/feedback(id=${event.id})}" class="btn btn-secondary">Leave Feedback</a> -->
                    <button
                      th:attr="onclick=|hideModal('infoModal' + ${event.getId()})|"
                      class="btn btn-secondary"
                    >
                      Close
                    </button>
                  </div>
                  <!-- <button class="btn btn-secondary" th:onclick="|exportEvent(${event.id}, this)|">Export Attendees</button> -->

                  <!-- Delete event button which only shows if user is a club organiser and also is the owner of the event -->
                </div>
                <div id="right">
                  <p>
                    <strong>Location:</strong>
                    <span th:text="${event.getLocation()}"></span>
                  </p>
                  <iframe
                    id="LocationEmbedd"
                    width="400"
                    height="250"
                    loading="lazy"
                    th:src="@{${'https://www.google.com/maps?q=' + event.getLocation() + '&output=embed'}}"
                  >
                  </iframe>
                </div>
              </section>
              <hr class="divider" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <div layout:fragment="scripts">
      <script th:inline="javascript">
        function showModal(modalId, eventId) {
          const modal = document.getElementById(modalId);
          modal.style.display = "block";

          fetch(`/events/modal/${eventId}`)
            .then((res) => res.json())
            .then((data) => {
              // Delete Event (existing)
              const deleteWrapper = modal.querySelector(".delete-btn-wrapper");
              if (deleteWrapper)
                deleteWrapper.style.display = data.canEdit
                  ? "inline-block"
                  : "none";

              // + Add image button
              const addBtn = modal.querySelector(
                ".gallery button.btn.btn-sm.btn-primary"
              );
              if (addBtn) addBtn.classList.toggle("hidden", !data.canEdit);

              // Per-image delete 'X' buttons
              modal.querySelectorAll(".gallery .delete-btn").forEach((btn) => {
                btn.classList.toggle("hidden", !data.canEdit);
              });
            })
            .catch((err) => console.error(err));
        }

        function hideModal(modalId) {
          const modal = document.getElementById(modalId);
          if (modal) modal.style.display = "none";
        }

        // close modal when you click off it
        document.addEventListener("click", (e) => {
          const overlay = e.target.closest(".modal");
          if (overlay && e.target === overlay) {
            hideModal(overlay.id);
          }
        });
      </script>
    </div>
  </body>
</html>
