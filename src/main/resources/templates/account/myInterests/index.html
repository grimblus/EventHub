<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout.html}"
>
  <head>
    <title>Sign up to EventHub</title>
    <!-- <script src="content-script.js"></script> -->
  </head>

  <body>
    <div layout:fragment="content">
      <div class="interest-sections">
        <h2>Your Interests</h2>
        <form
                class="interest-box"
                th:action="@{/account/myInterests/tags}"
                method="post"
        >
          <h3>Categories</h3>
          <div class="interest-buttons">
            <div th:each="category : ${categories}">
              <label>
                <input
                        type="checkbox"
                        th:value="${category}"
                        th:attr="checked=${interests.contains(category.name()) ? 'checked' : null}"
                />
                <span th:text="${category}">category</span>
              </label>
            </div>
          </div>
        </form>
        <form
          class="interest-box"
          th:action="@{/account/myInterests/tags}"
          method="post"
        >
          <h3>Tags</h3>
          <div class="interest-buttons">
            <div th:each="tag : ${tags}">
              <label>
                <input
                  type="checkbox"
                  th:value="${tag}"
                  th:attr="checked=${interests.contains(tag.name()) ? 'checked' : null}"
                />
                <span th:text="${tag}">tag</span>
              </label>
            </div>
          </div>
        </form>
        <!-- <div class="interest-box">
          <h3>Keywords</h3>
          <div class="interest-buttons">
            <button th:each="keyword : ${keywords}" th:text="${keyword}">
              interest
            </button>
          </div>
        </div> -->
      </div>
    </div>
  </body>
</html>
