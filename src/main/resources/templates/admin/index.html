<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/layout.html}"
>
<head>
    <title>Admin</title>
    <!-- <script src="content-script.js"></script> -->
    <style>
        h1 {
            text-align: center;
        }
        form {
            text-align: center;
        }
        form {
            background-color: rgb(236, 224, 224);
            width: 300px;
            border: 3px solid rgb(0, 0, 0);
            padding: 50px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <h1>Admin Display</h1>

    <div style="text-align: center; margin-bottom: 20px;">
        <a th:href="@{/admin/users}"
           th:classappend="${active == 'users'} ? 'active-tab' : ''">Users</a> |
        <a th:href="@{/admin/events}"
           th:classappend="${active == 'events'} ? 'active-tab' : ''">Events</a>
    </div>
    <div th:if="${active == 'users'}">
        <h2>Users</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Permissions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.firstName}"></td>
                    <td th:text="${user.lastName}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.permissionLevel.name()}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${active == 'events'}">
        <h2>Events</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Owner</th>
                <th>Date</th>
                <th>Location</th>
                <th>Category</th>
                <th>Ticket Price</th>
                <th>Keywords</th>
                <th>Tags</th>
                <th>Images</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.id}"></td>
                <td th:text="${event.title}"></td>
                <td th:text="${event.description}"></td>
                <td th:text="${event.ownerID}"></td>
                <td th:text="${event.date}"></td>
                <td th:text="${event.location}"></td>
                <td th:text="${event.category}"></td>
                <td th:text="${event.ticketPrice}"></td>
                <td th:text="${event.keywords}"></td>
                <td th:text="${event.tags}"></td>
                <td th:text="${event.images}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
