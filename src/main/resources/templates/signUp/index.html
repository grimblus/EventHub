<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout.html}"
>
  <head>
    <title>Welcome to EventHub</title>
    <!-- <script src="content-script.js"></script> -->
    <style>
      h1 {
        text-align: center;
      }

      form {
        background-color: rgb(223, 223, 223);
        width: 300px;
        border: 3px solid rgb(0, 0, 0);
        padding: 30px;
        margin: 0 auto;
      }
    </style>
  </head>

  <body>
    <div layout:fragment="content">
      <h1>Sign Up To EventHub</h1>
      <form action="#" th:action="@{/signUp}" th:object="${user}" method="post">
        <div class="group">
          <label for="firstname">First Name:</label><br />
          <input
            id="firstname"
            type="text"
            th:field="*{firstName}"
          /><br /><br />
        </div>
        <div class="group">
          <label for="lastname">Last Name:</label><br />
          <input id="lastname" type="text" th:field="*{lastName}" /><br /><br />
        </div>
        <div class="group">
          <label for="email">Email:</label><br />
          <input id="email" type="text" th:field="*{email}" /><br /><br />
        </div>
        <div class="group">
          <label for="password">Password:</label><br />
          <input id="password" type="password" th:field="*{password}" /><br />
        </div>
        <div class="permissionRadios">
          <label>Sign up as a:</label><br />

          <div class="radios" th:each="perm : ${permissions}">
            <label>
              <input
                type="radio"
                th:field="*{permissionLevel}"
                th:value="${perm}"
              />
              <span th:text="${perm}">Sign up as a:</span>
            </label>
          </div>
        </div>
        <div class="errors" th:each="error : ${errors}">
          <p th:if="${error}" th:text="${error}" style="color: red"></p>
        </div>
        <input type="submit" value="Submit" />
      </form>
    </div>
  </body>
</html>
