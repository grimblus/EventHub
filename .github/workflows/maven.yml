name: team-project-group-p05-02 CI tasks
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Github Actions Running"
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with maven
      run: ./mvnw --batch-mode --update-snapshots verify

# Test with https://github.com/nektos/act
# Run in terminal: act -n --container-architecture linux/amd64